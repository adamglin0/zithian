[versions]
# for build
androidCompileSdk = "36"
# kotlin
kotlin = "2.2.21"
binaryCompatibilityValidator = "0.18.1"
# android
androidGradlePlugin = "8.12.3"
# compose
composeMultiplatform = "1.10.0-rc02"
composeHotReload = "1.1.0-alpha02"
composeContinuousRoundedCornerShape = "1.0.6"
navigation3Runtime = "1.0.0"
navigation3UI = "1.0.0-alpha06"
navigation3ViewModel = "2.10.0-alpha06"
lifeCycleViewModelSavedState = "2.10.0-alpha06"
# other
haze = "1.7.1"
dokka = "2.1.0"
mavenPublish = "0.35.0"
detekt = "1.23.8"
liquid = "1.1.0"
coil = "3.3.0"
kotlinx-collections-immutable = "0.4.0"
jbrapi = "1.9.0"
ksp = "2.3.3"
[libraries]
# compose
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-ui-text = { module = "org.jetbrains.compose.ui:ui-text", version.ref = "composeMultiplatform" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3Runtime" }
navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3UI" }
navigation3-viewModel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "navigation3ViewModel" }
lifeCycleViewModelSavedState = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "lifeCycleViewModelSavedState" }
# coil
coil = { module = "io.coil-kt.coil3:coil", version.ref = "coil" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
coil-svg = { module = "io.coil-kt.coil3:coil-svg", version.ref = "coil" }
coil-video = { module = "io.coil-kt.coil3:coil-video", version.ref = "coil" }
# other
detekt-formatting = { group = "io.gitlab.arturbosch.detekt", name = "detekt-formatting", version.ref = "detekt" }
composeContinuousRoundedCornerShape = { module = "com.adamglin:compose-continuous-rounded-corner-shape", version.ref = "composeContinuousRoundedCornerShape" }
detekt-rules-compose = { group = "ru.kode", name = "detekt-rules-compose", version = "1.4.0" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
liquid = { module = "io.github.fletchmckee.liquid:liquid", version.ref = "liquid" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref="kotlinx-collections-immutable"}
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
jbr-api = { module = "org.jetbrains.runtime:jbr-api", version.ref = "jbrapi" }
[plugins]
# kotlin
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
binaryCompatibilityValidator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binaryCompatibilityValidator" }
# android
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidGradlePlugin" }
# compose
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
compose-hotReload = { id = "org.jetbrains.compose.hot-reload", version.ref = "composeHotReload" }
# other
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
